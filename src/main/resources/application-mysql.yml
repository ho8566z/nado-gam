# 실행: --spring.profiles.active=mysql (접속 정보는 환경변수로 주입, 문서에 값을 쓰지 않는다)
# 주의: schema.sql 이 테이블을 DROP 후 다시 만든다. 개발용 DB 에서만 사용한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nadogam?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
