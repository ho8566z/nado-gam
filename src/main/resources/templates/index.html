<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('나도 감')}"></head>
<body class="home">
<header th:replace="~{fragments/layout :: header('home')}"></header>

<main class="page">

	<!-- 가운데에서 돌아가는 지구본과 비행기 -->
	<section class="hero" aria-labelledby="hero-title">
		<div class="hero-copy">
			<p class="eyebrow">나도 감 · 항공권 전문 여행사</p>
			<h1 id="hero-title">어디로 떠나볼까요?</h1>
			<p class="hero-lead">인천에서 출발하는 항공편이 지구 곳곳으로 날아갑니다.</p>
		</div>
		<div class="globe-wrap">
			<div id="globe" class="globe" role="img" aria-label="인천에서 세계 각지로 비행기가 날아가는 지구본"></div>
			<noscript><p class="globe-note">지구본을 보려면 자바스크립트가 필요합니다.</p></noscript>
		</div>
		<p class="hero-hint"><span class="dot dot--gold"></span> 기획전·베스트셀러 여행지 <span class="dot dot--blue"></span> 그 밖의 취항지 · 지구본을 끌어서 돌려볼 수 있어요</p>
	</section>

	<!-- 이달의 기획전 3개 캐로셀 -->
	<section class="shelf" id="plans" aria-labelledby="plans-title">
		<div class="shelf-head">
			<div>
				<span class="kicker">THIS MONTH</span>
				<h2 id="plans-title">이달의 기획전</h2>
			</div>
			<a class="more" th:href="@{/special}" data-transition>전체 보기 →</a>
		</div>
		<div class="carousel" data-carousel data-autoplay="6500" aria-roledescription="carousel" aria-label="이달의 기획전">
			<div class="viewport">
				<div class="track">
					<div class="slide" th:each="p : ${plans}" role="group" aria-roledescription="slide">
						<a th:replace="~{fragments/cards :: planPoster(${p})}"></a>
					</div>
				</div>
			</div>
			<button class="nav nav--prev" type="button" aria-label="이전 기획전">‹</button>
			<button class="nav nav--next" type="button" aria-label="다음 기획전">›</button>
			<div class="dots" role="tablist" aria-label="기획전 선택"></div>
		</div>
		<th:block th:if="${#lists.isEmpty(plans)}"><div th:replace="~{fragments/mascot :: empty('진행 중인 기획전이 없습니다.')}"></div></th:block>
	</section>

	<!-- 베스트셀러 3개 캐로셀 -->
	<section class="shelf" id="bestsellers" aria-labelledby="best-title">
		<div class="shelf-head">
			<div>
				<span class="kicker">BEST SELLER</span>
				<h2 id="best-title">베스트셀러</h2>
			</div>
			<a class="more" th:href="@{/bestseller}" data-transition>전체 보기 →</a>
		</div>
		<div class="carousel" data-carousel data-autoplay="7500" aria-roledescription="carousel" aria-label="베스트셀러">
			<div class="viewport">
				<div class="track">
					<div class="slide" th:each="b, st : ${bestsellers}" role="group" aria-roledescription="slide">
						<a th:replace="~{fragments/cards :: bestPoster(${b}, ${st.count})}"></a>
					</div>
				</div>
			</div>
			<button class="nav nav--prev" type="button" aria-label="이전 베스트셀러">‹</button>
			<button class="nav nav--next" type="button" aria-label="다음 베스트셀러">›</button>
			<div class="dots" role="tablist" aria-label="베스트셀러 선택"></div>
		</div>
		<th:block th:if="${#lists.isEmpty(bestsellers)}"><div th:replace="~{fragments/mascot :: empty('집계된 베스트셀러가 없습니다.')}"></div></th:block>
	</section>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>


<script src="https://cdn.jsdelivr.net/npm/globe.gl@2/dist/globe.gl.min.js"></script>
<script th:src="@{/js/globe-utils.js}"></script>
<script th:src="@{/js/carousel.js}"></script>
<script th:src="@{/js/home-globe.js}"></script>
</body>
</html>
