<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('이달의 특별전')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('special')}"></header>
<main class="page">
	<section class="page-title">
		<span class="kicker">THIS MONTH</span>
		<h1>이달의 특별전</h1>
		<p>여행사가 추천하는 여행지의 항공편을 특가로 만나보세요.</p>
	</section>
	<section class="grid">
		<div class="grid-item" th:each="p : ${plans}">
			<a th:replace="~{fragments/cards :: planPoster(${p})}"></a>
		</div>
	</section>
	<th:block th:if="${#lists.isEmpty(plans)}"><div th:replace="~{fragments/mascot :: empty('진행 중인 기획전이 없습니다.')}"></div></th:block>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
