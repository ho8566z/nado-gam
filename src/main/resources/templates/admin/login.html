<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 로그인')}"></head>
<body>
<main class="page">
	<section class="auth-card">
		<span class="kicker">ADMIN</span>
		<h1>관리자 로그인</h1>
		<p class="lead">관리자 계정으로만 들어올 수 있습니다.</p>
		<div class="alert alert--error" role="alert" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않거나, 이용할 수 없는 계정입니다.</div>
		<div class="alert alert--ok" th:if="${param.logout}">로그아웃했습니다.</div>
		<form th:action="@{/admin/login}" method="post">
			<label class="field"><span>아이디</span>
				<input type="text" name="username" autocomplete="username" required autofocus>
			</label>
			<label class="field"><span>비밀번호</span>
				<input type="password" name="password" autocomplete="current-password" required>
			</label>
			<div class="form-actions"><button class="button" type="submit">로그인</button></div>
		</form>
		<p class="auth-sub"><a th:href="@{/}">사용자 사이트로 돌아가기</a></p>
	</section>
</main>
</body>
</html>
