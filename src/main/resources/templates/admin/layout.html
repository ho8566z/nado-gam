<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="admin-side" th:fragment="side(menu)">
	<a class="logo" th:href="@{/admin}"><span>nado_gam 관리자</span></a>
	<nav aria-label="관리자 메뉴">
		<a th:href="@{/admin}" th:classappend="${menu == 'dashboard'} ? 'is-active'">대시보드</a>
		<a th:href="@{/admin/members}" th:classappend="${menu == 'members'} ? 'is-active'">회원 관리</a>
		<a th:href="@{/admin/catalog}" th:classappend="${menu == 'catalog'} ? 'is-active'">상품 노출 관리</a>
		<a th:href="@{/admin/popups}" th:classappend="${menu == 'popups'} ? 'is-active'">팝업 관리</a>
		<a th:href="@{/admin/checkin}" th:classappend="${menu == 'checkin'} ? 'is-active'">체크인</a>
		<a th:href="@{/admin/inquiries}" th:classappend="${menu == 'inquiries'} ? 'is-active'">고객문의 관리</a>
		<a th:href="@{/}">사용자 사이트</a>
	</nav>
	<form th:action="@{/admin/logout}" method="post"><button type="submit">로그아웃</button></form>
</aside>
</body>
</html>
