<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 대시보드')}"></head>
<body>
<div class="admin-shell">
	<aside th:replace="~{admin/layout :: side('dashboard')}"></aside>
	<main class="admin-main">
		<h1>대시보드</h1>
		<div class="stat-grid">
			<div class="stat"><b th:text="${memberCount}">0</b><span>전체 회원</span></div>
			<div class="stat"><b th:text="${activeMemberCount}">0</b><span>이용 중인 회원</span></div>
			<div class="stat"><b th:text="${destinationCount}">0</b><span>여행지</span></div>
			<div class="stat"><b th:text="${flightCount}">0</b><span>항공편</span></div>
			<a class="stat stat--link" th:href="@{/admin/inquiries(status=RECEIVED)}"><b th:text="${unansweredCount}">0</b><span>답변 대기 문의</span></a>
		</div>
	</main>
</div>
</body>
</html>
