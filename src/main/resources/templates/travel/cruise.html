<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${destination.nameKo() + ' 크루즈'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header('travel')}"></header>
<main class="page">
	<a class="back" th:href="@{/travel}" data-transition>← 여행지 선택</a>
	<section class="tour-hero" th:style="'--from:' + ${destination.from()} + ';--to:' + ${destination.to()}">
		<span class="tour-badge" th:text="${destination.regionLabel()}">유럽</span>
		<h1 th:text="${destination.nameKo()}">바르셀로나</h1>
		<p class="tour-hero-sub" th:text="${destination.summary()}">소개</p>
	</section>
	<div class="stay-wrap">
		<nav th:replace="~{fragments/stay :: tabs(${destination.destinationId()}, 'cruise', ${hasCruise})}"></nav>
		<th:block th:if="${cruise == null}"><div th:replace="~{fragments/mascot :: empty('이 여행지에는 크루즈가 없어요.')}"></div></th:block>
		<article class="cruise-card" th:if="${cruise != null}">
			<h2 th:text="${cruise.title}">크루즈 이름</h2>
			<p class="cruise-meta"><span th:text="${cruise.shipName}">배 이름</span> · <span th:text="${cruise.periodLabel()}">7박 8일</span> · 출항 <span th:text="${cruise.departurePort}">항구</span></p>
			<p class="cruise-route" th:text="${cruise.itinerary}">일정</p>
			<p class="hotel-amenity" th:text="${cruise.highlights}">하이라이트</p>
			<div class="cruise-prices">
				<div><span class="muted">내측 객실 (1인)</span><strong th:text="${cruise.insideLabel()}">₩1,290,000</strong></div>
				<div><span class="muted">발코니 객실 (1인)</span><strong th:text="${cruise.balconyLabel()}">₩1,790,000</strong></div>
			</div>
		</article>
		<form class="cart-form cruise-form" th:if="${cruise != null}" th:action="@{/cart/add}" method="post">
			<input type="hidden" name="type" value="CRUISE">
			<input type="hidden" name="refId" th:value="${cruise.cruiseId}">
			<label>출발 날짜 <input type="date" name="date" required th:attr="min=${#temporals.format(#temporals.createToday().plusDays(1), 'yyyy-MM-dd')},max=${#temporals.format(#temporals.createToday().plusYears(1), 'yyyy-MM-dd')}"></label>
			<label>객실
				<select name="cabin"><option value="INSIDE">내측</option><option value="BALCONY">발코니</option></select>
			</label>
			<label>인원 <input type="number" name="quantity" value="2" min="1" max="8" required></label>
			<button type="submit" class="button">장바구니 담기</button>
		</form>
		<p class="muted small">크루즈 이름·일정·가격은 가상 데이터입니다.</p>
	</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
