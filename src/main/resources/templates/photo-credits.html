<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('사진 출처')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<main class="page page--narrow">
	<section class="page-title">
		<span class="kicker">PHOTO CREDITS</span>
		<h1>사진 출처</h1>
		<p>여행지 카드의 대표 관광지 사진은 Wikipedia·Wikimedia Commons 에서 가져왔고, 각 사진의 저작자와 라이선스는 아래와 같습니다. 사진 속 장소 설명과 상품 정보는 가상 데이터입니다.</p>
	</section>

	<p class="empty" th:if="${#lists.isEmpty(credits)}">등록된 사진이 없어요.</p>

	<div class="table-wrap" th:unless="${#lists.isEmpty(credits)}">
		<table class="table credit-table">
			<thead>
				<tr><th>여행지</th><th>사진 속 장소</th><th>저작자</th><th>라이선스</th><th>원본</th></tr>
			</thead>
			<tbody>
				<tr th:each="c : ${credits}">
					<td th:text="${c.place}">파리</td>
					<td th:text="${c.subject}">Eiffel Tower</td>
					<td class="cell-wrap" th:text="${c.author}">Author</td>
					<td th:text="${c.license}">CC BY-SA 3.0</td>
					<td><a class="link-sm" th:href="${c.source}" target="_blank" rel="noopener noreferrer">보기</a></td>
				</tr>
			</tbody>
		</table>
	</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
