<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 마스코트: 코뿔소 거코가 붉은 프로펠러 비행기를 타고 난다 (애니메이션 '붉은 돼지' 같은 분위기).
     45도 옆모습이다. SVG 로 직접 그렸고 움직임은 mascot.css 의 애니메이션이다. -->
<svg th:fragment="mascotSvg(cls)" th:class="'mascot ' + ${cls}" viewBox="0 0 260 170" role="img" aria-label="코뿔소 거코가 붉은 프로펠러 비행기를 타고 날아가는 모습">
	<g class="mascot-lift">
		<g transform="rotate(-7 130 90)">

			<!-- 먼 쪽 날개(동체 뒤) -->
			<path d="M108 66 L168 66 L150 40 L100 42 Z" fill="#a9231d"/>
			<path d="M100 42 L150 40 L152 44 L103 46 Z" fill="#f3e3c3"/>

			<!-- 꼬리날개: 수직·수평 -->
			<path d="M40 68 L20 34 L50 38 L66 66 Z" fill="#b92a22"/>
			<path d="M24 38 L44 40" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round"/>
			<path d="M46 80 L10 94 L26 100 L64 86 Z" fill="#a9231d"/>

			<!-- 동체 -->
			<path d="M34 68 Q62 62 112 63 L180 68 Q208 72 210 88 Q208 104 180 108 L112 106 Q62 102 34 84 Z" fill="#d7332b"/>
			<path d="M40 86 Q70 98 112 100 L180 102 Q200 100 206 94 Q198 106 180 108 L112 106 Q62 102 34 84 Z" fill="#a9231d" opacity="0.55"/>
			<!-- 오렌지 줄무늬 -->
			<path d="M52 78 Q90 74 124 76 L176 80" fill="none" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round"/>

			<!-- 조종석과 거코 -->
			<ellipse cx="140" cy="64" rx="26" ry="7" fill="#3a1411"/>
			<g class="mascot-rider">
				<!-- 몸통과 앞발(조종간을 잡는다) -->
				<path d="M120 68 Q122 48 142 46 Q158 46 160 68 Z" fill="#98a3bb"/>
				<ellipse cx="140" cy="62" rx="14" ry="9" fill="#b4bdd1"/>
				<path d="M156 62 Q166 66 168 74" fill="none" stroke="#7f8aa3" stroke-width="8" stroke-linecap="round"/>
				<circle cx="169" cy="75" r="4.4" fill="#98a3bb"/>
				<path d="M170 76 L174 86" stroke="#3a1411" stroke-width="3" stroke-linecap="round"/>

				<!-- 스카프: 바람에 펄럭인다 -->
				<g class="mascot-scarf">
					<path d="M128 52 Q112 50 98 58 Q88 62 76 58 Q88 70 102 68 Q116 66 130 60 Z" fill="#f3e3c3"/>
					<path d="M100 60 Q90 62 80 59" fill="none" stroke="#ff8a1f" stroke-width="2.2" stroke-linecap="round"/>
				</g>

				<!-- 머리: 45도 옆모습, 오른쪽을 본다 -->
				<ellipse cx="146" cy="30" rx="8" ry="11" fill="#7f8aa3" transform="rotate(-18 146 30)"/>
				<ellipse cx="146" cy="31" rx="4" ry="7" fill="#ffb0a0" opacity="0.8" transform="rotate(-18 146 31)"/>
				<ellipse cx="158" cy="44" rx="22" ry="17" fill="#98a3bb"/>
				<ellipse cx="180" cy="52" rx="17" ry="12" fill="#b4bdd1"/>
				<circle cx="190" cy="54" r="2.6" fill="#59647c"/>
				<path d="M175 60 Q184 63 192 59" fill="none" stroke="#59647c" stroke-width="1.8" stroke-linecap="round"/>
				<!-- 뿔 두 개 -->
				<path d="M184 44 Q194 24 204 22 Q202 38 194 49 Z" fill="#f6e7c4"/>
				<path d="M176 42 Q180 31 186 29 Q185 38 182 45 Z" fill="#e8d4a2"/>
				<!-- 가죽 모자와 고글 -->
				<path d="M138 42 Q140 22 162 24 Q172 26 172 36 L150 42 Z" fill="#7a4a2a"/>
				<path d="M140 40 L172 38" stroke="#4a2a14" stroke-width="2.4" stroke-linecap="round"/>
				<circle cx="168" cy="40" r="7" fill="#3a1411"/>
				<circle cx="168" cy="40" r="4.6" fill="#bfe6ff"/>
				<circle cx="166.6" cy="38.6" r="1.4" fill="#fff"/>
				<path d="M161 40 L142 44" stroke="#3a1411" stroke-width="2.6" stroke-linecap="round"/>
				<circle cx="164" cy="52" r="3.8" fill="#ff9fb0" opacity="0.6"/>
			</g>

			<!-- 앞 유리 -->
			<path d="M166 63 L176 52 L180 66 Z" fill="#bfe6ff" opacity="0.55"/>

			<!-- 가까운 쪽 날개(동체 앞으로 나온다) -->
			<path d="M96 92 L166 96 L186 136 L88 130 Z" fill="#d7332b"/>
			<path d="M88 130 L186 136 L184 130 L92 124 Z" fill="#f3e3c3"/>
			<path d="M96 92 L166 96 L168 100 L98 96 Z" fill="#a9231d"/>
			<path d="M118 96 L112 128 M150 98 L156 132" stroke="#a9231d" stroke-width="2" opacity="0.6"/>

			<!-- 엔진 덮개, 프로펠러 -->
			<ellipse cx="208" cy="88" rx="8" ry="18" fill="#8f1f1a"/>
			<ellipse class="mascot-prop-disc" cx="216" cy="88" rx="5" ry="36" fill="#fff" opacity="0.22"/>
			<g class="mascot-prop">
				<path d="M216 88 L213 52 Q216 50 219 52 Z" fill="#3a1411"/>
				<path d="M216 88 L213 124 Q216 126 219 124 Z" fill="#3a1411"/>
			</g>
			<ellipse cx="216" cy="88" rx="4.5" ry="5.5" fill="#ff8a1f"/>
		</g>

		<!-- 속도선 -->
		<g class="mascot-wind" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.5">
			<path d="M4 58 L30 58 M0 112 L36 112 M14 132 L44 132"/>
		</g>
	</g>
</svg>

<!-- 결과가 없을 때 보여 주는 빈 화면 -->
<div th:fragment="empty(message)" class="empty empty--mascot">
	<svg th:replace="~{fragments/mascot :: mascotSvg('mascot--sm')}"></svg>
	<p th:text="${message}">결과가 없어요.</p>
</div>

</body>
</html>
