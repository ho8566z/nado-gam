<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' | nado_gam'">nado_gam</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/travel.css}">
	<link rel="stylesheet" th:href="@{/css/auth.css}">
	<link rel="stylesheet" th:href="@{/css/mascot.css}">
	<link rel="stylesheet" th:href="@{/css/popup.css}">
	<link rel="stylesheet" th:href="@{/css/tour.css}">
	<script defer th:src="@{/js/common.js}"></script>
</head>
<body>
<header class="site-header" th:fragment="header(active)">
	<a class="logo" th:href="@{/}" data-transition>
		<svg th:replace="~{fragments/mascot :: mascotSvg('mascot--logo')}"></svg>
		<span>nado_gam</span>
	</a>
	<nav aria-label="주 메뉴">
		<a th:href="@{/account}" th:classappend="${active == 'account'} ? 'is-active'">계정</a>
		<a th:href="@{/travel}" th:classappend="${active == 'travel'} ? 'is-active'">해외 여행</a>
		<a th:href="@{/domestic}" th:classappend="${active == 'domestic'} ? 'is-active'">국내여행</a>
		<a th:href="@{/tour}" th:classappend="${active == 'tour'} ? 'is-active'">투어</a>
		<a th:href="@{/special}" th:classappend="${active == 'special'} ? 'is-active'">이달의 특별기획</a>
		<a th:href="@{/bestseller}" th:classappend="${active == 'bestseller'} ? 'is-active'">베스트셀러</a>
		<a th:href="@{/support}" th:classappend="${active == 'support'} ? 'is-active'">고객문의</a>
		<span class="auth-links">
			<th:block th:if="${loginUser == null}">
				<a th:href="@{/login}">로그인</a>
				<a th:href="@{/signup}">회원가입</a>
			</th:block>
			<th:block th:if="${loginUser != null}">
				<span class="who" th:text="${loginUser.username} + '님'">user님</span>
				<form th:action="${loginUser.admin} ? @{/admin/logout} : @{/logout}" method="post">
					<button type="submit">로그아웃</button>
				</form>
			</th:block>
		</span>
	</nav>
</header>
<footer class="site-footer" th:fragment="footer">
	<p>nado_gam · 나도 감 — 4차 개인 프로젝트 (여행사)</p>
	<p>모든 항공편·편명·가격은 실제 노선을 참고해 임의로 만든 가상 데이터입니다.</p>
	<!-- 휴대폰 폭에서만 보이는 하단 탭 바. 현재 메뉴 표시는 common.js 가 주소를 보고 정한다. -->
	<nav class="tabbar" aria-label="모바일 메뉴">
		<a th:href="@{/}" data-tab="/" data-tab-exact>
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
			<span>홈</span>
		</a>
		<a th:href="@{/travel}" data-tab="/travel">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
			<span>여행</span>
		</a>
		<a th:href="@{/domestic}" data-tab="/domestic">
			<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></svg>
			<span>국내</span>
		</a>
		<a th:href="@{/special}" data-tab="/special">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>
			<span>기획</span>
		</a>
		<a th:href="@{/tour}" data-tab="/tour">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.2A7 7 0 0 1 19 9.8C19 14.8 12 21 12 21z"/><circle cx="12" cy="10" r="2.6"/></svg>
			<span>투어</span>
		</a>
		<a th:href="@{/support}" data-tab="/support">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>
			<span>문의</span>
		</a>
		<a th:href="@{/account}" data-tab="/account">
			<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
			<span>내 정보</span>
		</a>
	</nav>
</footer>
</body>
</html>
