<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('account')}"></header>
<main class="page">
	<section class="auth-card">
		<span class="kicker">MY ACCOUNT</span>
		<h1>비밀번호 변경</h1>
		<form th:action="@{/account/password}" th:object="${passwordForm}" method="post" novalidate>
			<label class="field"><span>현재 비밀번호</span>
				<input type="password" th:field="*{currentPassword}" autocomplete="current-password" required>
				<small class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></small>
			</label>
			<label class="field"><span>새 비밀번호</span>
				<input type="password" th:field="*{newPassword}" autocomplete="new-password" maxlength="20" required>
				<small class="hint">영문과 숫자를 포함해 8~20자</small>
				<small class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></small>
			</label>
			<label class="field"><span>새 비밀번호 확인</span>
				<input type="password" th:field="*{newPasswordConfirm}" autocomplete="new-password" maxlength="20" required>
				<small class="error" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></small>
			</label>
			<div class="form-actions">
				<button class="button" type="submit">변경</button>
				<a class="button button--ghost" th:href="@{/account}">취소</a>
			</div>
		</form>
	</section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
