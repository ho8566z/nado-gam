# 로컬 개발용: H2 인메모리(MySQL 호환 모드). MySQL 사용 시 application-mysql.yml 참고
spring:
  datasource:
    url: jdbc:h2:mem:nadogam;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  web:
    resources:
      cache:
        period: 0   # 개발 중에는 CSS·JS 를 캐시하지 않는다
